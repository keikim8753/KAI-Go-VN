# Decap CMS 설정 — 6.4·7.6절 관리자 페이지
# 인증: Netlify Identity + Git Gateway (7.6절). Vercel/GitHub Pages로 호스팅을 바꾸는 경우
# backend를 아래 github 백엔드로 교체하고 GitHub OAuth App을 별도 등록해야 한다.
backend:
  name: git-gateway
  branch: main

# 4.3절: 관리자 페이지 저장은 즉시 게시되지 않고 draft → in review → ready 상태를 거친다.
# 이 3단계가 5장의 review_status(draft/masking_reviewed/translation_reviewed/approved)와 대응되며,
# 각 단계 전환마다 브랜치·PR이 자동 생성되어 11.2절의 branch protection·PR 승인 절차로 합류한다.
publish_mode: editorial_workflow

media_folder: "site/public/logos"
public_folder: "/logos"

site_url: https://example.com # TODO: 실제 배포 URL로 교체

collections:
  - name: "companies_ko"
    label: "기업 정보 (한국어)"
    folder: "content/ko/companies"
    create: true
    delete: false # 10장 리스크: 하드 삭제는 CMS에서 금지 — is_published 필드로만 소프트 삭제
    slug: "{{company_id}}"
    identifier_field: company_id
    summary: "{{name}} — {{sector}}"
    fields: &company_fields_ko
      - { label: "기업 ID (sector코드-일련번호, 신규 등록 시 다음 번호 확인 필요)", name: "company_id", widget: "string", pattern: ["^[a-z]+-[0-9]{2}$", "예: csec-01"] }
      - { label: "기업명", name: "name", widget: "string" }
      - { label: "로고 이미지", name: "logo_image", widget: "image", required: false }
      - label: "산업분야"
        name: "sector"
        widget: "select"
        options:
          - { label: "사이버보안 및 보안관제", value: "cybersecurity" }
          - { label: "제조혁신 (제조 DX)", value: "manufacturing-dx" }
          - { label: "의료헬스케어바이오", value: "healthcare" }
          - { label: "클라우드인프라플랫폼", value: "cloud-infra" }
          - { label: "환경에너지스마트시티", value: "environment-energy" }
          - { label: "AI데이터분석솔루션", value: "ai-data" }
          - { label: "교육콘텐츠서비스플랫폼", value: "edutech" }
      - { label: "한 줄 소개", name: "tagline", widget: "string" }
      - { label: "솔루션/서비스 소개 (3~5문장)", name: "solution_summary", widget: "text" }
      - { label: "비즈니스 모델", name: "business_model", widget: "string", hint: "예: B2B, B2C, B2G, SaaS" }
      - { label: "ICT 단계", name: "ict_stage", widget: "string", hint: "예: 판매중, 현장적용, 실증, 개발" }
      - { label: "공식 홈페이지 URL", name: "official_website", widget: "string" }
      - label: "희망 협력분야 원문 (내부 전용 — 실명 포함 가능)"
        name: "target_buyer_raw"
        widget: "text"
        required: false
        hint: "⚠ 여기 입력한 내용은 사이트에 절대 노출되지 않습니다. 아래 '희망 협력분야 표시 문구'는 이 원문을 참고해 담당자가 직접 작성하세요 (API 자동 생성 아님, 3.2절 참조)."
      - label: "희망 협력분야 표시 문구 (사이트에 노출됨 — 직접 작성)"
        name: "target_buyer_display"
        widget: "string"
        hint: >-
          실명이 아닌 업종·유형으로 일반화된 문구만 입력하세요. 참고 예시 — 통신사→"현지 통신·ICT 기업",
          리조트/유통→"리테일·리조트 운영사", 은행/금융→"금융권 기관", 병원→"병원·헬스케어 솔루션 바이어",
          공공기관→"공공 ICT 기관", 대기업→"대기업 그룹", SI/유통→"현지 SI/유통 파트너" (3장 참조).
      - { label: "소개서 PDF 링크 (선택, 기업 동의 시에만)", name: "reference_pdf_links", widget: "list", field: { label: "링크", name: "url", widget: "string" }, required: false }
      - label: "검수 상태"
        name: "review_status"
        widget: "select"
        default: "draft"
        options: ["draft", "masking_reviewed", "translation_reviewed", "approved"]
        hint: "approved 상태로 병합되어야 실제 사이트에 반영됩니다 (4장 ⑥단계)."
      - { label: "공개 여부 (체크 해제 = 소프트 삭제)", name: "is_published", widget: "boolean", default: false, hint: "기업을 사이트에서 내리려면 삭제하지 말고 이 체크를 해제하세요 — URL이 깨지지 않습니다 (10장 리스크 참조)." }
      - { label: "입력 경로", name: "source", widget: "hidden", default: "admin_cms" }
      - { label: "마지막 수정자", name: "last_edited_by", widget: "hidden", required: false }
      - { label: "마지막 수정 시각", name: "last_edited_at", widget: "hidden", required: false }

  - name: "companies_en"
    label: "Company Info (English)"
    folder: "content/en/companies"
    create: true
    delete: false
    slug: "{{company_id}}"
    identifier_field: company_id
    summary: "{{name}} — {{sector}}"
    fields:
      - { label: "Company ID (sector-code-serial, check next number before creating)", name: "company_id", widget: "string", pattern: ["^[a-z]+-[0-9]{2}$", "e.g. csec-01"] }
      - { label: "Company Name", name: "name", widget: "string" }
      - { label: "Logo Image", name: "logo_image", widget: "image", required: false }
      - label: "Sector"
        name: "sector"
        widget: "select"
        options:
          - { label: "Cybersecurity & Security Monitoring", value: "cybersecurity" }
          - { label: "Manufacturing Innovation (Manufacturing DX)", value: "manufacturing-dx" }
          - { label: "Healthcare & Bio", value: "healthcare" }
          - { label: "Cloud Infrastructure Platform", value: "cloud-infra" }
          - { label: "Environment, Energy & Smart City", value: "environment-energy" }
          - { label: "AI & Data Analytics Solutions", value: "ai-data" }
          - { label: "Education Content Service Platform", value: "edutech" }
      - { label: "Tagline", name: "tagline", widget: "string" }
      - { label: "Solution Summary (3-5 sentences)", name: "solution_summary", widget: "text" }
      - { label: "Business Model", name: "business_model", widget: "string" }
      - { label: "ICT Stage", name: "ict_stage", widget: "string" }
      - { label: "Official Website URL", name: "official_website", widget: "string" }
      - label: "Target Buyer Raw Text (internal only — may contain real names)"
        name: "target_buyer_raw"
        widget: "text"
        required: false
        hint: "⚠ Never rendered on the site. Use this as reference to write the display text below yourself (not auto-generated by an API — section 3.2)."
      - label: "Target Buyer Display Text (shown on site — write this yourself)"
        name: "target_buyer_display"
        widget: "string"
        hint: >-
          Use industry/type-level phrasing only, never real names. Examples — telecom→"local telecom & ICT
          companies", resort/retail→"retail/resort operators", bank/finance→"financial institutions",
          hospital→"hospital/healthcare solution buyers", government→"public ICT institutions",
          conglomerate→"large corporate groups", SI/distribution→"local SI/distribution partners" (section 3).
      - { label: "Reference PDF Links (optional, only with company consent)", name: "reference_pdf_links", widget: "list", field: { label: "URL", name: "url", widget: "string" }, required: false }
      - label: "Review Status"
        name: "review_status"
        widget: "select"
        default: "draft"
        options: ["draft", "masking_reviewed", "translation_reviewed", "approved"]
      - { label: "Published (uncheck = soft delete)", name: "is_published", widget: "boolean", default: false }
      - { label: "Source", name: "source", widget: "hidden", default: "admin_cms" }
      - { label: "Last Edited By", name: "last_edited_by", widget: "hidden", required: false }
      - { label: "Last Edited At", name: "last_edited_at", widget: "hidden", required: false }

  - name: "companies_vi"
    label: "Thông tin doanh nghiệp (Tiếng Việt)"
    folder: "content/vi/companies"
    create: true
    delete: false
    slug: "{{company_id}}"
    identifier_field: company_id
    summary: "{{name}} — {{sector}}"
    fields:
      - { label: "Mã doanh nghiệp (mã lĩnh vực-số thứ tự)", name: "company_id", widget: "string", pattern: ["^[a-z]+-[0-9]{2}$", "vd: csec-01"] }
      - { label: "Tên doanh nghiệp", name: "name", widget: "string" }
      - { label: "Logo", name: "logo_image", widget: "image", required: false }
      - label: "Lĩnh vực"
        name: "sector"
        widget: "select"
        options:
          - { label: "An ninh mạng & Giám sát an ninh", value: "cybersecurity" }
          - { label: "Đổi mới sản xuất (Manufacturing DX)", value: "manufacturing-dx" }
          - { label: "Y tế & Công nghệ sinh học", value: "healthcare" }
          - { label: "Nền tảng hạ tầng đám mây", value: "cloud-infra" }
          - { label: "Môi trường, Năng lượng & Thành phố thông minh", value: "environment-energy" }
          - { label: "Giải pháp AI & Phân tích dữ liệu", value: "ai-data" }
          - { label: "Nền tảng dịch vụ nội dung giáo dục", value: "edutech" }
      - { label: "Giới thiệu ngắn", name: "tagline", widget: "string" }
      - { label: "Giới thiệu giải pháp (3-5 câu)", name: "solution_summary", widget: "text" }
      - { label: "Mô hình kinh doanh", name: "business_model", widget: "string" }
      - { label: "Giai đoạn ICT", name: "ict_stage", widget: "string" }
      - { label: "URL website chính thức", name: "official_website", widget: "string" }
      - label: "Văn bản gốc đối tác mong muốn (chỉ nội bộ — có thể chứa tên thật)"
        name: "target_buyer_raw"
        widget: "text"
        required: false
        hint: "⚠ Không bao giờ hiển thị trên trang web. Hãy dùng nội dung này làm tham khảo để tự viết văn bản hiển thị bên dưới (không tự động tạo bằng API — mục 3.2)."
      - label: "Văn bản hiển thị đối tác mong muốn (hiển thị trên trang web — tự viết)"
        name: "target_buyer_display"
        widget: "string"
        hint: >-
          Chỉ dùng cách diễn đạt theo ngành/loại hình, không dùng tên thật. Ví dụ — viễn thông→"doanh nghiệp
          viễn thông·ICT địa phương", resort/bán lẻ→"đơn vị vận hành resort/bán lẻ", ngân hàng/tài chính→"tổ
          chức tài chính", bệnh viện→"đối tác giải pháp bệnh viện·y tế", cơ quan nhà nước→"cơ quan ICT công
          cộng", tập đoàn lớn→"tập đoàn lớn", SI/phân phối→"đối tác SI/phân phối địa phương" (mục 3).
      - { label: "Liên kết PDF tham khảo (tùy chọn)", name: "reference_pdf_links", widget: "list", field: { label: "URL", name: "url", widget: "string" }, required: false }
      - label: "Trạng thái kiểm duyệt"
        name: "review_status"
        widget: "select"
        default: "draft"
        options: ["draft", "masking_reviewed", "translation_reviewed", "approved"]
      - { label: "Công khai (bỏ chọn = xóa mềm)", name: "is_published", widget: "boolean", default: false }
      - { label: "Nguồn", name: "source", widget: "hidden", default: "admin_cms" }
      - { label: "Người chỉnh sửa cuối", name: "last_edited_by", widget: "hidden", required: false }
      - { label: "Thời gian chỉnh sửa cuối", name: "last_edited_at", widget: "hidden", required: false }
