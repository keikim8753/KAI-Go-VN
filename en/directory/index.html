nments.","key_metrics":[{"label":"Detection accuracy","value":"99.1%"},{"label":"Monitoring staff reduction","value":"40%"},{"label":"Deployments to date","value":"500+"}],"vietnam_fit":"Aligned with Decree 53/2022 (data localization) and Vietnam's national cybersecurity strategy, supporting local data center integration to meet compliance while strengthening security.","sdgs":[9,16],"official_website":"https://www.igloo.co.kr","target_buyer_display":"Seeking partnerships with local telecom/ICT companies and public institutions. Matching inquiries via KICC HCMC.","pdf_documents":[],"is_published":true},{"company_id":"hc-01","name":"Waycen","logo_image":"/logos/hc-01.svg","sector":"healthcare","events":[],"tagline":"Real-time AI-assisted lesion detection for colonoscopy","problem":"Colorectal cancer rates in Vietnam are rising quickly, while a shortage of specialist endoscopists and inconsistent early-lesion detection rates leave early-diagnosis infrastructure weak.","value_summary":"Waycen provides a real-time AI-assisted colonoscopy solution that helps detect lesions and improves the accuracy and consistency of physician diagnosis.","key_metrics":[{"label":"Adenoma detection increase","value":"+11%"},{"label":"Real-time processing latency","value":"<100ms"},{"label":"Hospitals in clinical use","value":"200+"}],"vietnam_fit":"Aligned with the Ministry of Health's early cancer-screening expansion policy, enabling remote reading support for provincial hospitals and helping close the healthcare gap.","sdgs":[3],"official_website":"https://example.com/waycen","target_buyer_display":"Seeking partnerships with major general hospitals and local healthcare institutions. Matching inquiries via KICC HCMC.","pdf_documents":[],"is_published":true}]</script><script>(function(){const locale = "en";
const base = "/KAI-Go-VN";

    const data = JSON.parse(document.getElementById('companies-data').textContent);
    const resultsEl = document.getElementById('results');
    const noResultsEl = document.getElementById('no-results');
    const sectorSelect = document.getElementById('filter-sector');
    const sdgSelect = document.getElementById('filter-sdg');
    const eventCheck = document.getElementById('filter-event');

    function cardHtml(company) {
      const logo = company.logo_image
        ? `<img class="logo" src="${company.logo_image}" alt="" loading="lazy" />`
        : '';
      const metric = company.key_metrics?.[0];
      const metricHtml = metric
        ? `<p class="tagline"><strong style="color:var(--accent)">${metric.value}</strong> ${metric.label}</p>`
        : '';
      const badges = [
        ...(company.events ?? []).map((e) => `<span class="badge">${e.name}</span>`),
        ...(company.sdgs ?? []).slice(0, 3).map((n) => `<span class="badge">SDG ${n}</span>`),
      ].join('');
      return `
        <a class="glass-card company-card" href="${base}/${locale}/company/${company.company_id}">
          ${logo}
          <div class="body">
            <h3>${company.name}</h3>
            <p class="tagline">${company.tagline}</p>
            ${metricHtml}
            <div class="card-badges">${badges}</div>
          </div>
        </a>
      `;
    }

    function render() {
      const sector = sectorSelect.value;
      const sdg = sdgSelect.value ? Number(sdgSelect.value) : null;
      const eventOnly = eventCheck.checked;

      const filtered = data.filter((c) => {
        if (sector && c.sector !== sector) return false;
        if (sdg && !(c.sdgs ?? []).includes(sdg)) return false;
        if (eventOnly && !(c.events ?? []).length) return false;
        return true;
      });

      resultsEl.innerHTML = filtered.map(cardHtml).join('');
      noResultsEl.hidden = filtered.length > 0;
    }

    [sectorSelect, sdgSelect, eventCheck].forEach((el) => el.addEventListener('change', render));
    render();
  })();</script></main><div class="trust-bar">66+ Companies · 7 Sectors · Supported by NIPA · VI / EN / KO</div><footer class="footer"><p>All content on this site is reviewed before publication.</p><p><a href="mailto:hcmc@nipa.kr">Contact: hcmc@nipa.kr</a></p></footer></body></html>
