[{"name":"9월 방문단","date":"2026-09"}],"tagline":"AI 비전으로 실시간 제품 불량을 선별합니다","problem":"베트남 제조업체 다수는 여전히 육안 검사에 의존한 품질관리를 하고 있어 불량 선별 정확도가 낮고 검사 인력 의존도가 높습니다.","value_summary":"에이트테크는 AI 비전 기반 자동 선별 솔루션으로 미세 결함까지 실시간으로 검출하며, 생산 라인에 무중단으로 적용할 수 있습니다.","key_metrics":[{"label":"선별 정확도","value":"99.3%"},{"label":"검사 처리 속도","value":"3배"},{"label":"도입 라인 수","value":"80+"}],"vietnam_fit":"베트남 정부의 스마트제조 전환 지원 정책(SMEdx)과 정합하며, 현지 제조 인력 재배치를 통한 생산성 향상에 기여합니다.","sdgs":[9],"official_website":"https://example.com/8ttech","target_buyer_display":"현지 제조 대기업 및 산업단지 운영기관과의 협력을 희망하며, 매칭 문의는 KICC HCMC를 통해 받습니다.","pdf_documents":[],"is_published":true},{"company_id":"csec-01","name":"이글루코퍼레이션","logo_image":"/logos/csec-01.svg","sector":"cybersecurity","events":[{"name":"InnoEx","date":"2026-08"}],"tagline":"AI 기반 보안관제로 디지털 인프라를 지킵니다","problem":"베트남 기업·기관은 랜섬웨어·공급망 공격 등 사이버 위협이 빠르게 늘고 있지만, 보안관제 인력과 통합 모니터링 체계가 부족한 상황입니다.","value_summary":"이글루코퍼레이션은 AI 기반 통합보안관제(SIEM) 플랫폼으로 실시간 위협 탐지와 대응을 자동화합니다. 금융·공공·제조 분야에서 검증된 노하우로 온프레미스와 클라우드를 아우르는 보안 인프라 구축을 지원합니다.","key_metrics":[{"label":"위협 탐지 정확도","value":"99.1%"},{"label":"관제 인력 절감","value":"40%"},{"label":"누적 구축 사례","value":"500+"}],"vietnam_fit":"베트남 정부의 Decree 53/2022(데이터 현지화)와 국가 사이버보안 전략에 부합하며, 현지 데이터센터 연동 구축이 가능해 규제 준수와 보안 강화를 동시에 달성합니다.","sdgs":[9,16],"official_website":"https://www.igloo.co.kr","target_buyer_display":"현지 통신·ICT 기업 및 공공기관과의 파트너십을 희망하며, 매칭 문의는 KICC HCMC를 통해 받습니다.","pdf_documents":[],"is_published":true},{"company_id":"hc-01","name":"웨이센","logo_image":"/logos/hc-01.svg","sector":"healthcare","events":[],"tagline":"실시간 AI로 대장내시경 병변 발견을 돕습니다","problem":"베트남은 대장암 발병률이 빠르게 증가하고 있지만, 내시경 전문의 부족과 초기 병변 발견율 편차로 조기 진단 인프라가 취약한 상황입니다.","value_summary":"웨이센은 AI 기반 실시간 대장내시경 보조 솔루션으로 병변 발견을 지원하고, 의료진의 진단 정확도와 일관성을 높입니다.","key_metrics":[{"label":"선종 발견율 향상","value":"+11%"},{"label":"실시간 처리 지연","value":"<100ms"},{"label":"임상 적용 병원","value":"200+"}],"vietnam_fit":"베트남 보건부의 암 조기검진 확대 정책과 정합하며, 지방 병원까지 원격 판독 지원이 가능해 의료 격차 해소에 기여합니다.","sdgs":[3],"official_website":"https://example.com/waycen","target_buyer_display":"현지 대형 종합병원 및 의료기관과의 협력을 희망하며, 매칭 문의는 KICC HCMC를 통해 받습니다.","pdf_documents":[],"is_published":true}]</script><script>(function(){const locale = "ko";
const base = "/KAI-Go-VN";

    const data = JSON.parse(document.getElementById('companies-data').textContent);
    const resultsEl = document.getElementById('results');
    const noResultsEl = document.getElementById('no-results');
    const sectorSelect = document.getElementById('filter-sector');
    const sdgSelect = document.getElementById('filter-sdg');
    const eventCheck = document.getElementById('filter-event');

    function cardHtml(company) {
      const logo = company.logo_image
        ? `<img class="logo" src="${company.logo_image}" alt="" loading="lazy" />`
        : '';
      const metric = company.key_metrics?.[0];
      const metricHtml = metric
        ? `<p class="tagline"><strong style="color:var(--accent)">${metric.value}</strong> ${metric.label}</p>`
        : '';
      const badges = [
        ...(company.events ?? []).map((e) => `<span class="badge">${e.name}</span>`),
        ...(company.sdgs ?? []).slice(0, 3).map((n) => `<span class="badge">SDG ${n}</span>`),
      ].join('');
      return `
        <a class="glass-card company-card" href="${base}/${locale}/company/${company.company_id}">
          ${logo}
          <div class="body">
            <h3>${company.name}</h3>
            <p class="tagline">${company.tagline}</p>
            ${metricHtml}
            <div class="card-badges">${badges}</div>
          </div>
        </a>
      `;
    }

    function render() {
      const sector = sectorSelect.value;
      const sdg = sdgSelect.value ? Number(sdgSelect.value) : null;
      const eventOnly = eventCheck.checked;

      const filtered = data.filter((c) => {
        if (sector && c.sector !== sector) return false;
        if (sdg && !(c.sdgs ?? []).includes(sdg)) return false;
        if (eventOnly && !(c.events ?? []).length) return false;
        return true;
      });

      resultsEl.innerHTML = filtered.map(cardHtml).join('');
      noResultsEl.hidden = filtered.length > 0;
    }

    [sectorSelect, sdgSelect, eventCheck].forEach((el) => el.addEventListener('change', render));
    render();
  })();</script></main><div class="trust-bar">66+ 기업 · 7개 분야 · NIPA 지원 · VI / EN / KO</div><footer class="footer"><p>본 사이트의 콘텐츠는 사전 검수를 거쳐 게시됩니다.</p><p><a href="mailto:hcmc@nipa.kr">문의: hcmc@nipa.kr</a></p></footer></body></html>
