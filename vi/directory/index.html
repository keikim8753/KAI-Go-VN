"no-results" hidden style="color:var(--text-mid);" data-astro-cid-6sugkltf>Không có doanh nghiệp phù hợp.</p></div><script type="application/json" id="companies-data">[{"company_id":"ai-01","name":"8ttech","logo_image":"/logos/ai-01.svg","sector":"ai-data","events":[{"name":"Đoàn tham quan tháng 9","date":"2026-09"}],"tagline":"Phân loại lỗi sản phẩm bằng AI thị giác theo thời gian thực","problem":"Nhiều nhà máy tại Việt Nam vẫn phụ thuộc vào kiểm tra chất lượng bằng mắt thường, dẫn đến độ chính xác phân loại lỗi thấp và phụ thuộc nhiều vào nhân lực kiểm tra.","value_summary":"8ttech cung cấp giải pháp phân loại tự động dựa trên AI thị giác, phát hiện cả lỗi vi mô theo thời gian thực và có thể áp dụng vào dây chuyền sản xuất mà không gây gián đoạn.","key_metrics":[{"label":"Độ chính xác phân loại","value":"99.3%"},{"label":"Tốc độ xử lý kiểm tra","value":"x3"},{"label":"Dây chuyền đã triển khai","value":"80+"}],"vietnam_fit":"Phù hợp với chính sách hỗ trợ chuyển đổi sản xuất thông minh (SMEdx) của chính phủ Việt Nam, góp phần tái bố trí nhân lực sản xuất và nâng cao năng suất.","sdgs":[9],"official_website":"https://example.com/8ttech","target_buyer_display":"Mong muốn hợp tác với doanh nghiệp sản xuất lớn và ban quản lý khu công nghiệp. Liên hệ kết nối qua KICC HCMC.","pdf_documents":[],"is_published":true},{"company_id":"csec-01","name":"Igloo Corporation","logo_image":"/logos/csec-01.svg","sector":"cybersecurity","events":[{"name":"InnoEx","date":"2026-08"}],"tagline":"Nền tảng giám sát an ninh AI cho hạ tầng số của bạn","problem":"Các doanh nghiệp và cơ quan tại Việt Nam đang đối mặt với sự gia tăng nhanh chóng của các mối đe dọa mạng (ransomware, tấn công chuỗi cung ứng) nhưng thiếu nhân lực giám sát an ninh và hệ thống theo dõi tích hợp.","value_summary":"Igloo Corporation cung cấp nền tảng giám sát an ninh tích hợp (SIEM) dựa trên AI, tự động hóa việc phát hiện và ứng phó mối đe dọa theo thời gian thực. Kinh nghiệm được kiểm chứng tại lĩnh vực tài chính, công cộng và sản xuất, hỗ trợ xây dựng hạ tầng an ninh bao phủ cả môi trường tại chỗ và đám mây.","key_metrics":[{"label":"Độ chính xác phát hiện","value":"99.1%"},{"label":"Giảm nhân lực giám sát","value":"40%"},{"label":"Số dự án triển khai","value":"500+"}],"vietnam_fit":"Phù hợp với Nghị định 53/2022 (nội địa hóa dữ liệu) và chiến lược an ninh mạng quốc gia của Việt Nam, hỗ trợ triển khai trung tâm dữ liệu tại chỗ để vừa tuân thủ quy định vừa tăng cường bảo mật.","sdgs":[9,16],"official_website":"https://www.igloo.co.kr","target_buyer_display":"Mong muốn hợp tác với doanh nghiệp viễn thông·ICT địa phương và cơ quan công quyền. Liên hệ kết nối qua KICC HCMC.","pdf_documents":[],"is_published":true},{"company_id":"hc-01","name":"Waycen","logo_image":"/logos/hc-01.svg","sector":"healthcare","events":[],"tagline":"AI hỗ trợ phát hiện tổn thương trong nội soi đại tràng theo thời gian thực","problem":"Tỷ lệ ung thư đại trực tràng tại Việt Nam đang tăng nhanh, trong khi tình trạng thiếu bác sĩ nội soi chuyên khoa và sự chênh lệch trong tỷ lệ phát hiện tổn thương sớm khiến hạ tầng chẩn đoán sớm còn yếu.","value_summary":"Waycen cung cấp giải pháp hỗ trợ nội soi đại tràng theo thời gian thực dựa trên AI, giúp phát hiện tổn thương và nâng cao độ chính xác, tính nhất quán trong chẩn đoán của bác sĩ.","key_metrics":[{"label":"Tăng tỷ lệ phát hiện u tuyến","value":"+11%"},{"label":"Độ trễ xử lý thời gian thực","value":"<100ms"},{"label":"Bệnh viện áp dụng lâm sàng","value":"200+"}],"vietnam_fit":"Phù hợp với chính sách mở rộng tầm soát ung thư sớm của Bộ Y tế Việt Nam, hỗ trợ đọc kết quả từ xa cho các bệnh viện tuyến tỉnh, góp phần thu hẹp khoảng cách y tế.","sdgs":[3],"official_website":"https://example.com/waycen","target_buyer_display":"Mong muốn hợp tác với bệnh viện đa khoa lớn và cơ sở y tế địa phương. Liên hệ kết nối qua KICC HCMC.","pdf_documents":[],"is_published":true}]</script><script>(function(){const locale = "vi";
const base = "/KAI-Go-VN";

    const data = JSON.parse(document.getElementById('companies-data').textContent);
    const resultsEl = document.getElementById('results');
    const noResultsEl = document.getElementById('no-results');
    const sectorSelect = document.getElementById('filter-sector');
    const sdgSelect = document.getElementById('filter-sdg');
    const eventCheck = document.getElementById('filter-event');

    function cardHtml(company) {
      const logo = company.logo_image
        ? `<img class="logo" src="${company.logo_image}" alt="" loading="lazy" />`
        : '';
      const metric = company.key_metrics?.[0];
      const metricHtml = metric
        ? `<p class="tagline"><strong style="color:var(--accent)">${metric.value}</strong> ${metric.label}</p>`
        : '';
      const badges = [
        ...(company.events ?? []).map((e) => `<span class="badge">${e.name}</span>`),
        ...(company.sdgs ?? []).slice(0, 3).map((n) => `<span class="badge">SDG ${n}</span>`),
      ].join('');
      return `
        <a class="glass-card company-card" href="${base}/${locale}/company/${company.company_id}">
          ${logo}
          <div class="body">
            <h3>${company.name}</h3>
            <p class="tagline">${company.tagline}</p>
            ${metricHtml}
            <div class="card-badges">${badges}</div>
          </div>
        </a>
      `;
    }

    function render() {
      const sector = sectorSelect.value;
      const sdg = sdgSelect.value ? Number(sdgSelect.value) : null;
      const eventOnly = eventCheck.checked;

      const filtered = data.filter((c) => {
        if (sector && c.sector !== sector) return false;
        if (sdg && !(c.sdgs ?? []).includes(sdg)) return false;
        if (eventOnly && !(c.events ?? []).length) return false;
        return true;
      });

      resultsEl.innerHTML = filtered.map(cardHtml).join('');
      noResultsEl.hidden = filtered.length > 0;
    }

    [sectorSelect, sdgSelect, eventCheck].forEach((el) => el.addEventListener('change', render));
    render();
  })();</script></main><div class="trust-bar">66+ Doanh nghiệp · 7 Lĩnh vực · Hỗ trợ bởi NIPA · VI / EN / KO</div><footer class="footer"><p>Toàn bộ nội dung trên trang này được kiểm duyệt trước khi đăng.</p><p><a href="mailto:hcmc@nipa.kr">Liên hệ: hcmc@nipa.kr</a></p></footer></body></html>
