name: Sync from Google Sheets

# 4.1·4.2·11.3절 — 스프레드시트 경로. 변경분을 수집·마스킹·번역 초안까지 만든 뒤
# 사람 검수용 PR을 자동 생성한다. 이 워크플로우 자체는 main에 직접 반영하지 않는다.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 1 * * 1" # 매주 월요일 01:00 UTC (KST 10:00) — 4.2절 "주간 스케줄"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run sync.js (수집 → 표준화 → 마스킹 → 번역 초안)
        run: node scripts/sync.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          MASTER_SHEET_ID: ${{ secrets.MASTER_SHEET_ID }}
          SURVEY_SHEET_ID: ${{ secrets.SURVEY_SHEET_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }} # 선택 — 비어 있어도 정상 동작 (정규식/매핑표로 대체, 3.2절)
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}

      - name: Run validate.js (2차 안전장치, 11.2절)
        run: node scripts/validate.js
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }} # 선택 — 없으면 정규식/정합성 검사만 실행

      - name: Open PR for human review
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/${{ github.run_id }}
          base: main
          commit-message: "chore(sync): 구글 시트 동기화 변경분"
          title: "[동기화] 구글 시트 변경분 — 검수 필요"
          body: |
            반자동 동기화 스크립트(scripts/sync.js)가 생성한 변경분입니다.

            - 이 PR은 사람이 승인(Approve)하고 병합해야만 배포됩니다 (11.2절 branch protection).
            - 바이어 마스킹 문구·번역 결과·개인정보 노출 여부를 diff 또는 프리뷰 URL에서 확인 후 승인하세요.
            - `⚠ 충돌 감지` 로그가 있었다면 Actions 실행 로그를 확인해 관리자 페이지 수정분과 비교하세요 (4.3절).
          labels: automated-sync
