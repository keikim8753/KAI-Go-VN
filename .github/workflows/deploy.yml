name: Deploy

# 9·10장 — main 브랜치 병합 시(=PR 승인 후) 정적 사이트를 빌드해 GitHub Pages에 배포한다.
# pr-preview.yml과 같은 gh-pages 브랜치를 쓰되, keep_files: true로 프리뷰 하위 폴더를
# 덮어쓰지 않는다. 저장소 Settings → Pages → Source를 "Deploy from a branch: gh-pages"로
# 설정해야 실제로 서빙된다 (부록 체크리스트 3번).
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build static site
        working-directory: site
        run: npm run build

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          keep_files: true
