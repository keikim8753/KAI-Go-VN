name: Company Intake

# 4.2·4.3·9·10장 — GitHub Issue Forms 제출을 파싱해 콘텐츠 PR을 자동 생성한다.
# 이 워크플로우는 PR만 만들 뿐 main에는 절대 직접 반영하지 않는다 — 승인자가
# 프리뷰(pr-preview.yml)를 확인하고 branch protection 규칙에 따라 승인해야만 병합된다.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'company-intake')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse issue form and generate content JSON + PDF assets
        id: intake
        run: node scripts/issue-to-content.js
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}

      - name: Run validate.js (2차 안전장치, 3·9장)
        run: node scripts/validate.js

      - name: Create/update PR for human review
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: company/issue-${{ github.event.issue.number }}
          commit-message: "chore(company): Issue #${{ github.event.issue.number }} 반영 (${{ steps.intake.outputs.company_id }})"
          title: "[기업 정보] ${{ steps.intake.outputs.company_id }} — Issue #${{ github.event.issue.number }} 검수 필요"
          body: |
            Issue #${{ github.event.issue.number }} (@${{ github.event.issue.user.login }})에서 제출된 기업 정보(company_id: `${{ steps.intake.outputs.company_id }}`)입니다.

            - [ ] PR 프리뷰(pr-preview.yml이 자동 코멘트로 남기는 URL)에서 실제 렌더링 확인
            - [ ] 바이어 관련 문구가 실명이 아닌 업종·유형으로 일반화되어 있는지 확인 (3장)
            - [ ] PDF를 첨부했다면 게시 동의된 자료가 맞는지 확인 (4.3절)
            - [ ] 게시하려면 해당 언어 파일의 `review_status`를 `approved`로, `is_published`를 `true`로 함께 변경 후 승인

            이 PR은 입력자 본인이 아닌 별도 승인자가 승인해야 병합할 수 있습니다 (branch protection).
          labels: company-intake

      - name: Comment on the issue
        if: steps.pr.outputs.pull-request-number
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `제출하신 정보로 PR #${{ steps.pr.outputs.pull-request-number }} 이 자동 생성되었습니다. 승인자 검수 후 게시됩니다.`,
            });
