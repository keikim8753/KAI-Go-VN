name: Content Check

# 11.2절의 branch protection "Required status check"로 등록할 공용 검증.
# sync.yml/admin-review.yml 두 경로 모두 최종적으로 이 워크플로우가 PR에 붙는 체크를 통과해야
# 병합할 수 있다 (두 경로가 서로 다른 워크플로우 실행 이력을 가지므로, PR 자체에 붙는 체크는
# pull_request 이벤트로 트리거되는 이 워크플로우로 통일한다).
on:
  pull_request:
    branches: [main]
    paths:
      - "content/**/*.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/validate.js
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }} # 선택 — 없으면 정규식/정합성 검사만 실행 (기본 동작)
