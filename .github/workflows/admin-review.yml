name: Admin Page Review Automation

# 4.3·7.6·11.3절 — 관리자 페이지(Decap CMS git-gateway, Editorial Workflow) PR 경로.
# Decap이 만드는 브랜치는 "cms/..." 접두사를 갖는다. 여기서:
#   1) 변경된 기업 파일에 source/last_edited_by/last_edited_at을 자동 태깅하고
#   2) target_buyer_display가 비어 있는 경우에만 참고용 제안으로 채운 뒤 같은 PR에 커밋한다
#      (담당자가 이미 직접 입력했다면 절대 덮어쓰지 않음 — API 없이도 기본 동작, LLM_API_KEY는 선택적 보강)
#   3) validate.js를 최종 게이트로 실행한다.
# 스프레드시트 경로(sync.yml)와 동일하게 이 PR도 branch protection의 PR 승인을 거쳐야만 병합된다.
on:
  pull_request:
    branches: [main]
    paths:
      - "content/ko/companies/**.json"

permissions:
  contents: write

jobs:
  tag-and-validate:
    if: startsWith(github.head_ref, 'cms/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Detect changed company files
        id: changed
        run: |
          git fetch origin main
          FILES=$(git diff --name-only origin/main...HEAD -- 'content/ko/companies/*.json')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Tag admin edit + fill missing masking suggestion (4.3절)
        if: steps.changed.outputs.files != ''
        run: node scripts/tag-admin-edit.js ${{ steps.changed.outputs.files }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }} # 선택 — 비어 있어도 정상 동작 (정규식/매핑표로 대체)

      - name: Commit auto-tagged changes back to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add content/ko/companies
            git commit -m "chore(admin-review): source/last_edited_*·마스킹 초안 자동 반영"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "변경 없음 — 커밋 생략"
          fi

      - name: Run validate.js (2차 안전장치, 11.2절)
        run: node scripts/validate.js
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }} # 선택 — 없으면 정규식/정합성 검사만 실행
