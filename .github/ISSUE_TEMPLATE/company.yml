name: 기업 정보 등록/수정 (Company Registration/Update)
description: 4.2·4.3절 — 기업 정보를 등록하거나 기존 정보를 수정합니다. 제출 후 자동으로 PR이 생성되며, 승인자가 프리뷰를 확인하고 승인해야 실제 사이트에 반영됩니다.
title: "[Company] "
labels: ["company-intake"]
body:
  - type: markdown
    attributes:
      value: |
        ### 작성 전 꼭 확인하세요
        - 이 저장소는 **Public**입니다. 여기 적는 모든 내용(제목·본문·PDF 첨부 포함)은 제출 즉시 공개됩니다.
        - **바이어·담당자 실명, 연락처 등 개인정보는 절대 입력하지 마세요.** "희망 협력분야"는 업종·유형으로 일반화된 문구만 입력합니다 (예: 통신사 실명 → "현지 통신·ICT 기업", 병원 실명 → "현지 대형 종합병원").
        - PDF 자료는 기업이 **대외 공개용으로 제공에 동의한 자료만** 첨부하세요. 내부용·CONFIDENTIAL 자료는 업로드 금지입니다.

  - type: input
    id: company_id
    attributes:
      label: 기업 ID (수정 시에만 입력)
      description: 기존 기업 정보를 수정하는 경우 해당 기업의 company_id를 입력하세요 (예 - csec-01). 신규 등록이면 비워두세요 — 분야별 다음 번호가 자동으로 채번됩니다.
      placeholder: "csec-01 (신규면 비워두기)"
    validations:
      required: false

  - type: input
    id: name
    attributes:
      label: 기업명
      description: 언어에 상관없이 공통으로 쓸 기업명 (고유명사이므로 보통 번역하지 않습니다)
    validations:
      required: true

  - type: dropdown
    id: sector
    attributes:
      label: 산업분야
      options:
        - cybersecurity (사이버보안 및 보안관제)
        - manufacturing-dx (제조혁신)
        - healthcare (의료헬스케어바이오)
        - cloud-infra (클라우드인프라플랫폼)
        - environment-energy (환경에너지스마트시티)
        - ai-data (AI데이터분석솔루션)
        - edutech (교육콘텐츠서비스플랫폼)
    validations:
      required: true

  - type: input
    id: official_website
    attributes:
      label: 공식 홈페이지 URL
      placeholder: "https://example.com"
    validations:
      required: true

  - type: textarea
    id: logo_image
    attributes:
      label: 로고 이미지
      description: 이 텍스트 상자를 클릭한 뒤 로고 파일(PNG/SVG)을 드래그 앤 드롭하세요. GitHub이 자동으로 첨부 URL을 삽입합니다.
    validations:
      required: true

  - type: textarea
    id: events
    attributes:
      label: 참가 행사 (선택)
      description: "한 줄에 하나씩, '행사명 | YYYY-MM' 형식으로 입력하세요."
      placeholder: |
        InnoEx | 2026-08
        9월 방문단 | 2026-09
    validations:
      required: false

  - type: input
    id: sdgs
    attributes:
      label: 해당 SDGs (선택)
      description: 쉼표로 구분된 SDG 번호 (1~17)
      placeholder: "9, 11"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 베트남어 콘텐츠 (필수 — 기본 표시 언어)

  - type: input
    id: tagline_vi
    attributes:
      label: 한 줄 가치 제안 (VI)
    validations:
      required: true

  - type: textarea
    id: problem_vi
    attributes:
      label: 문제 (VI)
      description: 베트남 기업·기관이 겪는 문제를 1~2문장으로. 문제로 먼저 시작하세요(6장 가이드).
    validations:
      required: true

  - type: textarea
    id: value_summary_vi
    attributes:
      label: 해결과 가치 (VI)
      description: 솔루션이 무엇이고 어떤 가치를 주는지
    validations:
      required: true

  - type: textarea
    id: key_metrics_vi
    attributes:
      label: 핵심 수치 지표 (VI, 최대 3개)
      description: "한 줄에 하나씩, '수치 | 설명' 형식. 수치가 없으면 인증·수상 등 정성 지표로 대체하세요."
      placeholder: |
        99.3% | Độ chính xác phân loại
        x3 | Tốc độ xử lý
    validations:
      required: true

  - type: textarea
    id: vietnam_fit_vi
    attributes:
      label: 베트남 적용 포인트 (VI)
      description: 정책 정합성(PDP8, Decree 53/2022, SMEdx 등)을 1문장 이상 포함하세요.
    validations:
      required: true

  - type: input
    id: target_buyer_display_vi
    attributes:
      label: 희망 협력분야 (VI)
      description: "실명 금지 — 업종·유형만. 예: 통신사→'현지 통신·ICT 기업', 병원→'현지 대형 종합병원', 제조 대기업→'현지 제조 대기업'"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## 영어 콘텐츠 (선택 — 비워두면 검수자가 번역 필요 상태로 남겨둡니다)

  - type: input
    id: tagline_en
    attributes:
      label: Tagline (EN)
    validations:
      required: false

  - type: textarea
    id: problem_en
    attributes:
      label: Problem (EN)
    validations:
      required: false

  - type: textarea
    id: value_summary_en
    attributes:
      label: Solution & Value (EN)
    validations:
      required: false

  - type: textarea
    id: key_metrics_en
    attributes:
      label: Key Metrics (EN, up to 3)
      placeholder: |
        99.3% | Sorting accuracy
        3x | Processing speed
    validations:
      required: false

  - type: textarea
    id: vietnam_fit_en
    attributes:
      label: Vietnam Fit (EN)
    validations:
      required: false

  - type: input
    id: target_buyer_display_en
    attributes:
      label: Target Partners (EN)
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 한국어 콘텐츠 (선택)

  - type: input
    id: tagline_ko
    attributes:
      label: 한 줄 가치 제안 (KO)
    validations:
      required: false

  - type: textarea
    id: problem_ko
    attributes:
      label: 문제 (KO)
    validations:
      required: false

  - type: textarea
    id: value_summary_ko
    attributes:
      label: 해결과 가치 (KO)
    validations:
      required: false

  - type: textarea
    id: key_metrics_ko
    attributes:
      label: 핵심 수치 지표 (KO, 최대 3개)
      placeholder: |
        99.3% | 선별 정확도
        3배 | 처리 속도
    validations:
      required: false

  - type: textarea
    id: vietnam_fit_ko
    attributes:
      label: 베트남 적용 (KO)
    validations:
      required: false

  - type: input
    id: target_buyer_display_ko
    attributes:
      label: 희망 협력분야 (KO)
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## 자료실 PDF (선택, 4.3절)

  - type: textarea
    id: pdf_attachments
    attributes:
      label: PDF 자료 첨부
      description: >-
        각 파일을 이 상자에 드래그 앤 드롭한 뒤, 삽입된 링크 앞에 "제목 | 언어(vi/en/ko) | " 형식으로 붙여주세요.
        예: "회사소개서 | ko | https://github.com/user-attachments/files/....pdf" — 파일당 10MB 이하, 기업당 총 20MB 이하.
        ⚠ 반드시 기업이 대외 공개용으로 제공 동의한 자료만 첨부하세요.
    validations:
      required: false

  - type: dropdown
    id: is_published
    attributes:
      label: 공개 여부
      description: 승인자가 검수 후 최종적으로 반영합니다. "아니오"로 제출하면 소프트 삭제/비공개 상태로 남습니다.
      options:
        - "예 (검수 후 게시)"
        - "아니오 (비공개 유지)"
      default: 0
    validations:
      required: true
